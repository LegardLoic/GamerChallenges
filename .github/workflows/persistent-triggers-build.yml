name: Build Persistent Triggers Android64
on:
  push:
    branches: [ persistent-triggers-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: 5.10.0
      - uses: actions/upload-artifact@v4
        with:
          name: persistent-triggers-android64
          path: '**/*.geode'
